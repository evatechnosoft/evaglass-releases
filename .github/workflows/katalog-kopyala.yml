# Old clients still read this repo's apps.json; the source of truth is evaitec-ota.
name: katalog-kopyala
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kopyala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o apps.json https://raw.githubusercontent.com/evatechnosoft/evaitec-ota/main/apps.json
          python3 -c "import json; json.load(open('apps.json'))"
          git diff --quiet && exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "apps.json: evaitec-ota'dan kopya"
          git push
